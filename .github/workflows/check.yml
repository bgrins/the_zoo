name: Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  tests:
    runs-on: ubuntu-latest
    needs: lint
    env:
      PROXY_USER: ""
      PROXY_PASS: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Free up disk space
        run: |
          echo "=== Starting disk cleanup ==="
          echo "Initial space:"
          df -h /

          echo "Removing large SDK/runtime directories..."
          # Android (~14GB)
          sudo rm -rf /usr/local/lib/android

          # .NET (~2.7GB)
          sudo rm -rf /usr/share/dotnet

          # Haskell (~3GB)
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup

          # Large packages (~5.3GB)
          sudo apt-get remove -y '^aspnetcore-.*' || true
          sudo apt-get remove -y '^dotnet-.*' --fix-missing || true
          sudo apt-get remove -y '^llvm-.*' --fix-missing || true
          sudo apt-get remove -y 'php.*' --fix-missing || true
          sudo apt-get remove -y '^mongodb-.*' --fix-missing || true
          sudo apt-get remove -y '^mysql-.*' --fix-missing || true
          sudo apt-get remove -y azure-cli google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri --fix-missing || true
          sudo apt-get remove -y google-cloud-sdk --fix-missing || true
          sudo apt-get remove -y google-cloud-cli --fix-missing || true
          sudo apt-get autoremove -y
          sudo apt-get clean

          # Docker images
          sudo docker image prune --all --force

          # Swap storage (~4GB)
          sudo swapoff -a
          sudo rm -f /mnt/swapfile

          # Final space report
          echo ""
          echo "=== Cleanup complete ==="
          echo "Final space:"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 6

      # Bake reads compose but doesn't tag images the way compose names them, so compose
      # would rebuild everything. Tag each target <project>-<service> and give each its own
      # cache scope (a shared scope makes every export overwrite the others).
      - name: Compute bake overrides
        id: bake-overrides
        run: |
          project=$(docker compose config --format json | jq -r .name)
          {
            echo "set<<EOF"
            docker buildx bake -f docker-compose.yaml --print | jq -r --arg p "$project" '
              .target | keys[] |
              "\(.).tags=\($p)-\(.)",
              "\(.).cache-from=type=gha,scope=check-\(.)",
              "\(.).cache-to=type=gha,mode=max,scope=check-\(.)"'
            echo "*.pull=true"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Docker images
        uses: docker/bake-action@v6
        with:
          files: |
            ./docker-compose.yaml
          set: ${{ steps.bake-overrides.outputs.set }}
          load: true

      - name: Start Docker services
        run: |
          npm run start:ci
          docker ps

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Report disk space after build
        run: |
          echo "=== Disk space after Docker build ==="
          df -h /
          echo ""
          echo "=== Docker disk usage breakdown ==="
          docker system df -v
          echo ""
          echo "=== Summary ==="
          docker system df

          echo ""
          echo "=== Cleaning up BuildKit ==="
          docker buildx ls

          # Get the builder name, remove it, and recreate it
          BUILDER_NAME=$(docker buildx ls --format '{{.Name}}' | grep -v default | head -1)
          if [ ! -z "$BUILDER_NAME" ]; then
            echo "Removing builder: $BUILDER_NAME"
            docker buildx rm --force "$BUILDER_NAME"

            # Prune the released volume
            docker volume prune -af

            # Recreate the builder for subsequent builds
            echo "Recreating builder"
            docker buildx create --use --bootstrap
          fi

          echo ""
          echo "=== After BuildKit cleanup ==="
          df -h /
          echo ""
          docker system df -v
          echo ""
          docker system df

          echo "=== Available space on root filesystem ==="
          df -h / | tail -1 | awk '{print "Used: "$3" / Available: "$4" / Use%: "$5}'

      - name: Start on-demand containers
        run: |
          # Start on-demand containers excluding heavy ones (postmill, onestopshop)
          HEAVY=$(docker compose --profile heavy config --services)
          SERVICES=$(docker compose --profile on-demand config --services | grep -vxF "$HEAVY")

          echo "Starting on-demand services (excluding heavy): $SERVICES"
          docker compose up -d --wait --wait-timeout 600 $SERVICES
          docker ps --filter "status=running" --format "table {{.Names}}\t{{.Status}}"

      - name: Run integration tests
        run: npm run test:integration

      - name: Run remaining tests
        run: npx vitest run tests --exclude='**/smoke/**' --exclude='**/integration/**'

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Docker compose status ==="
          docker compose ps -a

          echo "=== Service logs ==="
          docker compose logs

      - name: Stop Docker services
        if: always()
        run: docker compose down
