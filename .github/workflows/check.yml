name: Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  tests:
    runs-on: ubuntu-latest
    env:
      PROXY_USER: ""
      PROXY_PASS: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The runner starts with ~86GB free. A cold build used 41GB and the on-demand images add
      # ~15GB, so removing SDKs only adds margin and can finish while the build runs.
      # Pulling the prebuilt on-demand images (vwa-classifieds alone takes ~3 minutes) also
      # overlaps the build; "Start on-demand containers" waits on the lock.
      - name: Start disk cleanup and on-demand image pulls in the background
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup > /dev/null 2>&1 &

          HEAVY=$(docker compose --profile heavy config --services)
          SERVICES=$(docker compose --profile on-demand config --services | grep -vxF "$HEAVY" | tr '\n' ' ')
          echo "ON_DEMAND_SERVICES=$SERVICES" >> "$GITHUB_ENV"
          read -ra services <<< "$SERVICES"
          (
            flock 9
            date -u +"pull started %T"
            docker compose --profile on-demand pull --ignore-buildable --quiet "${services[@]}" || echo "pull failed with exit $?"
            date -u +"pull finished %T"
          ) 9> "$RUNNER_TEMP/pull.lock" > "$RUNNER_TEMP/pull.log" 2>&1 < /dev/null &

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 6

      # Bake tags each target with its compose image name, so compose finds the images.
      # Read the per-image registry cache that docker-publish writes from main. It is public,
      # so fork PRs can read it too. Check writes no cache: exporting the database layers took
      # 3-4.5 minutes per run and overflowed the 10GB GitHub Actions cache. The empty cache-to
      # also drops compose's local cache export for caddy.
      - name: Compute bake overrides
        id: bake-overrides
        run: |
          cache="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "set<<EOF"
            docker buildx bake -f docker-compose.yaml --print | jq -r --arg c "$cache" '
              .target | keys[] |
              "\(.).cache-from=type=registry,ref=\($c)/\(.):buildcache",
              "\(.).cache-to="'
            echo "*.pull=true"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Docker images
        uses: docker/bake-action@v6
        with:
          files: |
            ./docker-compose.yaml
          set: ${{ steps.bake-overrides.outputs.set }}
          load: true

      - name: Start Docker services
        run: |
          npm run start:ci
          docker ps

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Report disk space after build
        run: |
          df -h /
          docker system df

      - name: Start on-demand containers
        run: |
          # compose up pulls anything the background pull missed or failed on
          echo "Waiting for the background image pull..."
          flock -w 600 "$RUNNER_TEMP/pull.lock" true || echo "Background pull still running"
          cat "$RUNNER_TEMP/pull.log"

          # On-demand services excluding heavy ones (postmill, onestopshop)
          echo "Starting on-demand services: $ON_DEMAND_SERVICES"
          read -ra services <<< "$ON_DEMAND_SERVICES"
          docker compose up -d --wait --wait-timeout 600 "${services[@]}"
          docker ps --filter "status=running" --format "table {{.Names}}\t{{.Status}}"
          df -h /

      - name: Run integration tests
        run: npm run test:integration

      - name: Run remaining tests
        run: npx vitest run tests --exclude='**/smoke/**' --exclude='**/integration/**'

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Docker compose status ==="
          docker compose --profile '*' ps -a

          echo "=== Service logs ==="
          docker compose --profile '*' logs
