name: Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels its running check. Each push to main gets a group of its own:
# in a shared group a pending run is cancelled by the next one, and the publish workflow
# waits for every main commit's tests check.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  tests:
    runs-on: ubuntu-latest
    # ~25 minutes with the registry build cache; a cold build takes much longer
    timeout-minutes: 90
    env:
      PROXY_USER: ""
      PROXY_PASS: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The runner starts with ~86GB free. A cold build used 41GB and the on-demand images add
      # ~15GB, so removing SDKs only adds margin and can finish while the build runs.
      # Pulling the prebuilt on-demand images (vwa-classifieds alone takes ~3 minutes) also
      # overlaps the build; "Start on-demand containers" waits on the lock.
      - name: Start disk cleanup and on-demand image pulls in the background
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup > /dev/null 2>&1 &

          HEAVY=$(docker compose --profile heavy config --services)
          ON_DEMAND=$(docker compose --profile on-demand config --services | grep -vxF "$HEAVY")
          # Created but not started: the global test setup probes its cold start
          COLD=$(sed -n 's/^export const COLD_START_SERVICE = "\([a-z0-9-]*\)";$/\1/p' tests/global-setup.ts)
          if [ -z "$COLD" ] || ! grep -qxF "$COLD" <<< "$ON_DEMAND"; then
            echo "::error::COLD_START_SERVICE in tests/global-setup.ts ('$COLD') is not a non-heavy on-demand service"
            exit 1
          fi
          SERVICES=$(echo "$ON_DEMAND" | tr '\n' ' ')
          {
            echo "STARTED_SERVICES=$(echo "$ON_DEMAND" | grep -vxF "$COLD" | tr '\n' ' ')"
            echo "COLD_SERVICES=$COLD"
          } >> "$GITHUB_ENV"
          read -ra services <<< "$SERVICES"
          (
            flock 9
            date -u +"pull started %T"
            docker compose --profile on-demand pull --ignore-buildable --quiet "${services[@]}" || echo "pull failed with exit $?"
            date -u +"pull finished %T"
          ) 9> "$RUNNER_TEMP/pull.lock" > "$RUNNER_TEMP/pull.log" 2>&1 < /dev/null &

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 6

      # Bake tags each target with its compose image name, so compose finds the images.
      # Read the per-image registry cache that docker-publish writes from main. It is public,
      # so fork PRs can read it too. Check writes no cache: exporting the database layers took
      # 3-4.5 minutes per run and overflowed the 10GB GitHub Actions cache.
      - name: Compute bake overrides
        id: bake-overrides
        run: |
          cache="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "set<<EOF"
            docker buildx bake -f docker-compose.yaml --print | jq -r --arg c "$cache" '
              .target | keys[] |
              "\(.).cache-from=type=registry,ref=\($c)/\(.):buildcache",
              "\(.).cache-to="'
            echo "*.pull=true"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Docker images
        uses: docker/bake-action@v6
        with:
          files: |
            ./docker-compose.yaml
          set: ${{ steps.bake-overrides.outputs.set }}
          load: true

      - name: Start Docker services
        id: core
        run: |
          npm run start:ci
          docker ps

      # The test steps run the suites directly: the npm scripts' --reporter=dot would replace
      # the CI reporters. Each suite runs unless the services it needs failed to start.
      - name: Run smoke tests
        run: npx vitest run tests/smoke

      - name: Report disk space after build
        if: ${{ !cancelled() }}
        run: |
          df -h /
          docker system df

      - name: Start on-demand containers
        id: on-demand
        if: ${{ !cancelled() && steps.core.outcome == 'success' }}
        run: |
          # compose up pulls anything the background pull missed or failed on
          echo "Waiting for the background image pull..."
          flock -w 600 "$RUNNER_TEMP/pull.lock" true || echo "Background pull still running"
          cat "$RUNNER_TEMP/pull.log"

          # On-demand services excluding heavy ones (postmill, onestopshop)
          echo "Starting on-demand services: $STARTED_SERVICES"
          read -ra started <<< "$STARTED_SERVICES"
          docker compose up -d --wait --wait-timeout 600 "${started[@]}"
          read -ra cold <<< "$COLD_SERVICES"
          docker compose up --no-start "${cold[@]}"
          docker ps --filter "status=running" --format "table {{.Names}}\t{{.Status}}"
          df -h /

      - name: Run integration tests
        if: ${{ !cancelled() && steps.on-demand.outcome == 'success' }}
        run: npx vitest run tests/integration

      - name: Run remaining tests
        if: ${{ !cancelled() && steps.on-demand.outcome == 'success' }}
        run: npx vitest run tests --exclude='**/smoke/**' --exclude='**/integration/**'

      - name: Cache Playwright browsers
        if: ${{ !cancelled() && steps.on-demand.outcome == 'success' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Firefox
        id: playwright
        if: ${{ !cancelled() && steps.on-demand.outcome == 'success' }}
        run: npx playwright install --with-deps firefox

      - name: Run Playwright tests
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        run: npm run test:playwright

      # Last: it restarts the databases
      - name: Run infrastructure tests
        if: ${{ !cancelled() && steps.core.outcome == 'success' }}
        run: npm run test:infrastructure

      - name: Show logs on failure
        if: failure() || cancelled()
        run: |
          echo "=== Docker compose status ==="
          docker compose --profile '*' ps -a

          echo "=== Service logs ==="
          docker compose --profile '*' logs
