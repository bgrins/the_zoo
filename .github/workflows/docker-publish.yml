name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "core/**"
      - "sites/**"
      - "docker-compose.yaml"
      - "docker-compose.packages.yaml"
      - "cli/package.json"
      - ".github/workflows/**"
  workflow_dispatch:

# Each run waits for its commit's tests, so runs could finish out of order and leave
# latest/main on older images. One run per ref at a time; a newer pending run replaces an
# older pending one. A running publish is never cancelled, so it can't stop halfway.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  # Only publish images for commits whose Check workflow tests passed
  tests-passed:
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: Wait for the tests check on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: not waiting for tests"
            exit 0
          fi
          # check_runs[0] is the latest attempt, so a re-run of Check shows up here.
          # After a failure keep waiting a while for a re-run instead of failing at once.
          failed_since=""
          for attempt in $(seq 1 120); do
            if ! run=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?check_name=tests" \
              --jq '.check_runs[0] | select(.) | "\(.status) \(.conclusion)"'); then
              echo "check-runs query failed; retrying"
              sleep 30
              continue
            fi
            echo "tests check: ${run:-not started}"
            case "$run" in
              "completed success") exit 0 ;;
              completed*)
                failed_since=${failed_since:-$attempt}
                if [ $((attempt - failed_since)) -ge 60 ]; then
                  echo "tests failed and was not re-run to success within 30 minutes"
                  exit 1
                fi ;;
              "")
                # Check only runs on branch heads and PRs; a tag on another commit never gets one
                if [ "$attempt" -ge 20 ]; then
                  echo "No tests check exists for ${{ github.sha }}"
                  exit 1
                fi ;;
              *) failed_since="" ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for the tests check"
          exit 1

  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint, tests-passed]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core services
          - context: ./core/coredns
            dockerfile: Dockerfile
            image: coredns
          - context: ./core/caddy
            dockerfile: Dockerfile
            image: caddy
          - context: ./core/proxy
            dockerfile: Dockerfile
            image: proxy
          - context: ./core/stalwart
            dockerfile: Dockerfile
            image: stalwart
          - context: ./core/postgres
            dockerfile: Dockerfile
            image: postgres
          - context: ./core/mysql
            dockerfile: Dockerfile
            image: mysql
          - context: ./core/hydra
            dockerfile: Dockerfile
            image: hydra
          # App services
          - context: ./sites/apps/auth.zoo
            dockerfile: Dockerfile
            image: auth-zoo
          - context: ./sites/apps/misc.zoo
            dockerfile: Dockerfile
            image: misc-zoo
          - context: ./sites/apps/wiki.zoo
            dockerfile: Dockerfile
            image: wiki-zoo
          - context: ./sites/apps/secure.gravatar.com
            dockerfile: Dockerfile
            image: secure-gravatar-com
          - context: ./sites/apps/snappymail.zoo
            dockerfile: Dockerfile
            image: snappymail-zoo
          - context: ./sites/apps/gitea.zoo
            dockerfile: Dockerfile
            image: gitea-zoo
          - context: ./sites/apps/docs.gitea.zoo
            dockerfile: Dockerfile
            image: docs-gitea-zoo
          - context: ./sites/apps/analytics.zoo
            dockerfile: Dockerfile
            image: analytics-zoo

    steps:
      # The runner starts with ~86GB free; removing SDKs adds margin for the database
      # images and can finish while the build runs (the synchronous cleanup took ~2 minutes)
      - name: Free up disk space in the background
        if: matrix.image == 'postgres' || matrix.image == 'mysql'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup > /dev/null 2>&1 &

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read CLI version and determine tag
        id: cli-version
        run: |
          VERSION=$(jq -r .version cli/package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Use release version for git tags, dev version for branch pushes
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # A tag pushed before the version bump would republish the previous release
            if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match cli/package.json version $VERSION (expected v$VERSION)"
              exit 1
            fi
            echo "docker_tag=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker_tag=$VERSION-dev" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.cli-version.outputs.docker_tag }}

      # One registry cache per image instead of the 10GB GitHub Actions cache, which the
      # multi-arch database layers overflowed. Check reads it; ghcr refs must be lowercase.
      - name: Set cache ref
        id: cache
        run: echo "ref=${REGISTRY}/${IMAGE_PREFIX,,}/${{ matrix.image }}:buildcache" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          cache-to: type=registry,ref=${{ steps.cache.outputs.ref }},mode=max
          platforms: linux/amd64,linux/arm64

      - name: Report disk space
        if: always() && (matrix.image == 'postgres' || matrix.image == 'mysql')
        run: df -h /
