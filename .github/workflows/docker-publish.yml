name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "core/**"
      - "sites/**"
      - "docker-compose.yaml"
      - "docker-compose.packages.yaml"
      - ".github/workflows/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  # Only publish images for commits whose Check workflow tests passed
  tests-passed:
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: Wait for the tests check on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: not waiting for tests"
            exit 0
          fi
          # check_runs[0] is the latest attempt, so a re-run of Check shows up here.
          # After a failure keep waiting a while for a re-run instead of failing at once.
          failed_since=""
          for attempt in $(seq 1 120); do
            run=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?check_name=tests" \
              --jq '.check_runs[0] | select(.) | "\(.status) \(.conclusion)"')
            echo "tests check: ${run:-not started}"
            case "$run" in
              "completed success") exit 0 ;;
              completed*)
                failed_since=${failed_since:-$attempt}
                if [ $((attempt - failed_since)) -ge 60 ]; then
                  echo "tests failed and was not re-run to success within 30 minutes"
                  exit 1
                fi ;;
              "")
                # Check only runs on branch heads and PRs; a tag on another commit never gets one
                if [ "$attempt" -ge 20 ]; then
                  echo "No tests check exists for ${{ github.sha }}"
                  exit 1
                fi ;;
              *) failed_since="" ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for the tests check"
          exit 1

  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint, tests-passed]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core services
          - context: ./core/coredns
            dockerfile: Dockerfile
            image: coredns
          - context: ./core/caddy
            dockerfile: Dockerfile
            image: caddy
          - context: ./core/proxy
            dockerfile: Dockerfile
            image: proxy
          - context: ./core/stalwart
            dockerfile: Dockerfile
            image: stalwart
          - context: ./core/postgres
            dockerfile: Dockerfile
            image: postgres
          - context: ./core/mysql
            dockerfile: Dockerfile
            image: mysql
          - context: ./core/hydra
            dockerfile: Dockerfile
            image: hydra
          # App services
          - context: ./sites/apps/auth.zoo
            dockerfile: Dockerfile
            image: auth-zoo
          - context: ./sites/apps/misc.zoo
            dockerfile: Dockerfile
            image: misc-zoo
          - context: ./sites/apps/wiki.zoo
            dockerfile: Dockerfile
            image: wiki-zoo
          - context: ./sites/apps/secure.gravatar.com
            dockerfile: Dockerfile
            image: secure-gravatar-com
          - context: ./sites/apps/snappymail.zoo
            dockerfile: Dockerfile
            image: snappymail-zoo
          - context: ./sites/apps/gitea.zoo
            dockerfile: Dockerfile
            image: gitea-zoo
          - context: ./sites/apps/docs.gitea.zoo
            dockerfile: Dockerfile
            image: docs-gitea-zoo
          - context: ./sites/apps/analytics.zoo
            dockerfile: Dockerfile
            image: analytics-zoo

    steps:
      - name: Free up disk space
        if: matrix.image == 'postgres' || matrix.image == 'mysql'
        run: |
          echo "=== Starting disk cleanup ==="
          echo "Initial space:"
          df -h /

          echo "Removing large SDK/runtime directories..."
          # Android (~14GB)
          sudo rm -rf /usr/local/lib/android

          # .NET (~2.7GB)
          sudo rm -rf /usr/share/dotnet

          # Haskell (~3GB)
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup

          # Large packages (~5.3GB)
          sudo apt-get remove -y '^aspnetcore-.*' || true
          sudo apt-get remove -y '^dotnet-.*' --fix-missing || true
          sudo apt-get remove -y '^llvm-.*' --fix-missing || true
          sudo apt-get remove -y 'php.*' --fix-missing || true
          sudo apt-get remove -y '^mongodb-.*' --fix-missing || true
          sudo apt-get remove -y '^mysql-.*' --fix-missing || true
          sudo apt-get remove -y azure-cli google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri --fix-missing || true
          sudo apt-get remove -y google-cloud-sdk --fix-missing || true
          sudo apt-get remove -y google-cloud-cli --fix-missing || true
          sudo apt-get autoremove -y
          sudo apt-get clean

          # Docker images
          sudo docker image prune --all --force

          # Swap storage (~4GB)
          sudo swapoff -a
          sudo rm -f /mnt/swapfile

          # Final space report
          echo ""
          echo "=== Cleanup complete ==="
          echo "Final space:"
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read CLI version and determine tag
        id: cli-version
        run: |
          VERSION=$(jq -r .version cli/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Use release version for git tags, dev version for branch pushes
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "docker_tag=$VERSION" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "docker_tag=$VERSION-dev" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.cli-version.outputs.docker_tag }}

      # One registry cache per image instead of the 10GB GitHub Actions cache, which the
      # multi-arch database layers overflowed. Check reads it; ghcr refs must be lowercase.
      - name: Set cache ref
        id: cache
        run: echo "ref=${REGISTRY}/${IMAGE_PREFIX,,}/${{ matrix.image }}:buildcache" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          cache-to: type=registry,ref=${{ steps.cache.outputs.ref }},mode=max
          platforms: linux/amd64,linux/arm64
