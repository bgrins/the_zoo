name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "core/**"
      - "sites/**"
      - "docker-compose.yaml"
      - "docker-compose.packages.yaml"
      - "cli/package.json"
      - ".github/workflows/docker-publish.yml"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

# Each run waits for its commit's tests, so runs could finish out of order and leave
# latest/main on older images. One run per ref at a time; a newer pending run replaces an
# older pending one. A running publish is never cancelled, so it can't stop halfway.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  # Only main and release tags write the shared tags and the build cache. A manual run on
  # another branch pushes its commit's images and a tag named after the branch.
  SHARED_REF: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  # Only publish images for commits whose Check workflow tests passed
  tests-passed:
    runs-on: ubuntu-latest
    # The wait below gives up after 100 minutes, past Check's 90-minute tests job
    timeout-minutes: 110
    permissions:
      checks: read
      contents: read
    steps:
      # A tag pushed before the version bump would republish the previous release
      - name: Check the tag matches the CLI version
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/cli/package.json?ref=$GITHUB_SHA" | jq -r .version)
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match cli/package.json version $VERSION (expected v$VERSION)"
            exit 1
          fi

      - name: Wait for the tests check on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A manual run on main or a tag moves the shared tags, so it waits like a push
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$SHARED_REF" != true ]; then
            echo "Manual run on a branch: not waiting for tests"
            exit 0
          fi
          # check_runs[0] is the latest attempt, so a re-run of Check shows up here. 15368 is
          # GitHub Actions, so no other app's check named tests counts.
          # After a failure keep waiting a while for a re-run instead of failing at once.
          failed_since=""
          for attempt in $(seq 1 200); do
            if ! run=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?check_name=tests&app_id=15368" \
              --jq '.check_runs[0] | select(.) | "\(.status) \(.conclusion)"'); then
              echo "check-runs query failed; retrying"
              sleep 30
              continue
            fi
            echo "tests check: ${run:-not started}"
            case "$run" in
              "completed success") exit 0 ;;
              completed*)
                failed_since=${failed_since:-$attempt}
                if [ $((attempt - failed_since)) -ge 60 ]; then
                  echo "tests failed and was not re-run to success within 30 minutes"
                  exit 1
                fi ;;
              "")
                # Check only runs on branch heads and PRs; a tag on another commit never gets one
                if [ "$attempt" -ge 20 ]; then
                  echo "No tests check exists for ${{ github.sha }}"
                  exit 1
                fi ;;
              *) failed_since="" ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for the tests check"
          exit 1

  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [lint, tests-passed]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core services
          - context: ./core/coredns
            dockerfile: Dockerfile
            image: coredns
          - context: ./core/caddy
            dockerfile: Dockerfile
            image: caddy
          - context: ./core/proxy
            dockerfile: Dockerfile
            image: proxy
          - context: ./core/stalwart
            dockerfile: Dockerfile
            image: stalwart
          - context: ./core/postgres
            dockerfile: Dockerfile
            image: postgres
          - context: ./core/mysql
            dockerfile: Dockerfile
            image: mysql
          - context: ./core/hydra
            dockerfile: Dockerfile
            image: hydra
          # App services
          - context: ./sites/apps/auth.zoo
            dockerfile: Dockerfile
            image: auth-zoo
          - context: ./sites/apps/misc.zoo
            dockerfile: Dockerfile
            image: misc-zoo
          - context: ./sites/apps/wiki.zoo
            dockerfile: Dockerfile
            image: wiki-zoo
          - context: ./sites/apps/secure.gravatar.com
            dockerfile: Dockerfile
            image: secure-gravatar-com
          - context: ./sites/apps/snappymail.zoo
            dockerfile: Dockerfile
            image: snappymail-zoo
          - context: ./sites/apps/gitea.zoo
            dockerfile: Dockerfile
            image: gitea-zoo
          - context: ./sites/apps/docs.gitea.zoo
            dockerfile: Dockerfile
            image: docs-gitea-zoo
          - context: ./sites/apps/analytics.zoo
            dockerfile: Dockerfile
            image: analytics-zoo

    steps:
      # The runner starts with ~86GB free; removing SDKs adds margin for the database
      # images and can finish while the build runs (the synchronous cleanup took ~2 minutes)
      - name: Free up disk space in the background
        if: matrix.image == 'postgres' || matrix.image == 'mysql'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup > /dev/null 2>&1 &

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the commit's immutable sha-<sha> tag: tag-images moves the shared tags once
      # every image is built
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: type=sha,format=long

      # One registry cache per image instead of the 10GB GitHub Actions cache, which the
      # multi-arch database layers overflowed. Check reads it; ghcr refs must be lowercase.
      - name: Set cache ref
        id: cache
        run: echo "ref=${REGISTRY}/${IMAGE_PREFIX,,}/${{ matrix.image }}:buildcache" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          cache-to: ${{ env.SHARED_REF == 'true' && format('type=registry,ref={0},mode=max', steps.cache.outputs.ref) || '' }}
          platforms: linux/amd64,linux/arm64

      - name: Report disk space
        if: always() && (matrix.image == 'postgres' || matrix.image == 'mysql')
        run: df -h /

  # Runs only when every image built, so latest, main and a release's tags never mix images
  # from different commits
  tag-images:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the commit's images
        run: |
          VERSION=$(jq -r .version cli/package.json)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags=("$GITHUB_REF_NAME" "$VERSION")
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            tags=(main latest "$VERSION-dev")
          else
            tags=("${GITHUB_REF_NAME//[^a-zA-Z0-9_.-]/-}")
          fi
          base="$REGISTRY/${IMAGE_PREFIX,,}"
          mapfile -t images < <(yq '.jobs["build-and-push"].strategy.matrix.include[].image' .github/workflows/docker-publish.yml)

          # Every image must exist before any tag moves
          for image in "${images[@]}"; do
            docker buildx imagetools inspect "$base/$image:sha-$GITHUB_SHA" > /dev/null
          done
          for image in "${images[@]}"; do
            args=()
            for tag in "${tags[@]}"; do
              args+=(--tag "$base/$image:$tag")
            done
            docker buildx imagetools create "${args[@]}" "$base/$image:sha-$GITHUB_SHA"
            echo "$image: ${tags[*]}"
          done

  # Runs the release as users get it: the npm package, installed from its tarball, pulling
  # the published images anonymously. Publishing to npm stays manual (npm run publish:cli).
  release-smoke-test:
    if: github.ref_type == 'tag'
    needs: tag-images
    name: release-smoke-test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and pack the CLI
        run: |
          npm run build:cli
          npm pack ./dist --pack-destination "$RUNNER_TEMP"

      # A new ghcr.io package (e.g. coredns) is private until made public in its settings
      - name: Check the release's images are public for both platforms
        run: npx tsx scripts/verify-release-images.ts

      - name: Install the CLI from the tarball
        run: |
          npm install --global --prefix "$RUNNER_TEMP/cli" "$RUNNER_TEMP"/the_zoo-*.tgz
          echo "$RUNNER_TEMP/cli/bin" >> "$GITHUB_PATH"

      - name: Start the zoo
        run: |
          port=$(node -e 'const s = require("net").createServer().listen(0, "127.0.0.1", () => { console.log(s.address().port); s.close(); })')
          echo "ZOO_PROXY=http://localhost:$port" >> "$GITHUB_ENV"
          the_zoo start --wait --port "$port"

      # Static sites, a core app with its database, and an on-demand app Caddy starts
      - name: Request sites through the proxy
        run: |
          for url in http://status.zoo/ https://home.zoo/ https://auth.zoo/api/health https://misc.zoo/health; do
            curl -fsSk --max-time 120 --proxy "$ZOO_PROXY" -o /dev/null -w "$url %{http_code}\n" "$url"
          done

      - name: Show the zoo's status on failure
        if: failure()
        run: the_zoo status

      - name: Stop the zoo
        if: always()
        run: the_zoo stop
