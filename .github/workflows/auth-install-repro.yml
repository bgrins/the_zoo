name: Diagnose auth ARM install

on:
  push:
    branches:
      - diag/auth-install-qemu
    paths:
      - .github/workflows/auth-install-repro.yml

permissions:
  contents: read

jobs:
  native-arm-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Confirm native ARM runner
        run: |
          test "$(uname -m)" = aarch64
          docker info --format '{{.Architecture}}'
      - name: Build auth image without publishing
        run: |
          docker buildx build \
            --platform linux/arm64 --no-cache --progress=plain --load \
            -t auth-zoo:diag \
            -f sites/apps/auth.zoo/Dockerfile sites/apps/auth.zoo
      - name: Verify the ARM image and runtime tools
        run: |
          test "$(docker image inspect auth-zoo:diag --format '{{.Architecture}}')" = arm64
          docker run --rm --platform linux/arm64 --entrypoint node auth-zoo:diag -e '
            const esbuild = require("esbuild");
            const result = esbuild.transformSync("const answer: number = 42", { loader: "ts" });
            if (!result.code.includes("42")) process.exit(1);
            console.log("esbuild " + esbuild.version + " ARM binary works");
          '
          docker run --rm --platform linux/arm64 --entrypoint /node_modules/.bin/tsx auth-zoo:diag --version
