name: Diagnose auth ARM install

on:
  push:
    branches:
      - diag/auth-install-qemu
    paths:
      - .github/workflows/auth-install-repro.yml
      - scripts/diagnostics/sigill.c

permissions:
  contents: read

jobs:
  compile-sigill-probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Compile an ARM musl SIGILL handler
        run: |
          mkdir -p "$RUNNER_TEMP/probe"
          docker run --rm --platform linux/arm64 \
            --mount "type=bind,src=$PWD/scripts/diagnostics,dst=/src,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/probe,dst=/out" \
            alpine:3.24.2 sh -eu -c \
              'apk add --no-cache gcc musl-dev && gcc -shared -fPIC -O0 -o /out/sigill.so /src/sigill.c'
      - uses: actions/upload-artifact@v4
        with:
          name: sigill-probe
          path: ${{ runner.temp }}/probe/sigill.so

  buildkit-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Reproduce the publish build without pushing an image
        run: |
          timeout --signal=TERM --kill-after=10s 150s docker buildx build \
            --platform linux/arm64 --no-cache --progress=plain \
            --output type=cacheonly \
            -f sites/apps/auth.zoo/Dockerfile sites/apps/auth.zoo

  isolate-install:
    runs-on: ubuntu-24.04
    needs: compile-sigill-probe
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        variant: [current-no-native]
        attempt: [1]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: actions/download-artifact@v4
        with:
          name: sigill-probe
          path: ${{ runner.temp }}/auth-install
      - name: Prepare package inputs
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p "$RUNNER_TEMP/auth-install"
          case "$VARIANT" in
            old-no-native)
              git fetch --depth=15 origin main
              for file in package.json package-lock.json; do
                git show "96b8ba5:sites/apps/auth.zoo/$file" > "$RUNNER_TEMP/auth-install/$file"
              done
              ;;
            empty)
              printf '%s\n' '{"name":"empty","version":"1.0.0"}' > "$RUNNER_TEMP/auth-install/package.json"
              printf '%s\n' '{"name":"empty","version":"1.0.0","lockfileVersion":3,"requires":true,"packages":{"":{"name":"empty","version":"1.0.0"}}}' > "$RUNNER_TEMP/auth-install/package-lock.json"
              ;;
            *) cp sites/apps/auth.zoo/package*.json "$RUNNER_TEMP/auth-install/" ;;
          esac
      - name: Install under x86-to-ARM QEMU
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          for attempt in $(seq 1 8); do
            echo "Trace attempt $attempt"
            if timeout --signal=TERM --kill-after=10s 100s docker run --rm \
              --platform linux/arm64 \
              --mount "type=bind,src=$RUNNER_TEMP/auth-install,dst=/input,readonly" \
              -e LD_PRELOAD=/input/sigill.so \
              node:22.23.2-alpine sh -eu -c '
                cp /input/package.json /input/package-lock.json /
                cd /
                npm ci --omit=dev --omit=optional --ignore-scripts --loglevel=error
                echo "npm install completed"
              '; then
              :
            else
              status=$?
              if [ "$status" -eq 132 ]; then
                echo "Captured SIGILL on attempt $attempt"
                exit 0
              fi
              echo "Unexpected failure $status on attempt $attempt"
              exit "$status"
            fi
          done
          echo "No SIGILL across eight traced attempts"
          exit 1
