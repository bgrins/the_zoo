  onestopshop:
    <<: *zoo-common
    depends_on:
      <<: [*deps-dns, *deps-mysql]
    mem_limit: 2g
    image: ghcr.io/bgrins/vwa-shopping-optimized-standalone:1@sha256:1d2c3c043f8c95a4842e4b19782247a081e8b14a1ba0821a58d28c26d527a183
    # The bundled Redis saves Magento's config and page caches to dump.rdb in the container
    # layer, and the image's cache:flush runs before Redis is up, so the dump is removed before
    # every start. Magento restarts, and its PHP sessions reset, whenever mysql restores its
    # database.
    entrypoint:
      - sh
      - /zoo/follow-restore.sh
      - mysql
      - onestopshop
      - /var/lib/php/sessions
      - --
      - sh
      - -c
      - rm -f /var/www/magento2/dump.rdb && exec /docker-entrypoint.sh "$$@"
      - sh
      - supervisord
      - -n
      - -j
      - /supervisord.pid
    environment:
      - TZ=UTC
      - BASE_URL=https://onestopshop.zoo
      - MYSQL_PASSWORD=onestopshop_pw
      - MYSQL_USER=onestopshop_user
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=onestopshop_db
      # Elasticsearch's jvm.options sets a 1GB heap, which AlwaysPreTouch commits at startup
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - SSL_CERT_FILE=/caddy-ca/pki/authorities/local/root.crt
    volumes:
      - caddy_data:/caddy-ca:ro
      - ./core/follow-restore.sh:/zoo/follow-restore.sh:ro
      - zoo_state:/zoo-state:ro
    labels:
      - "zoo.domains=onestopshop.zoo:80"
      - "zoo.description=E-commerce shopping site from VisualWebArena"
      - "zoo.icon=🛍️"
      - "zoo.db=mysql"
    # 0 in fresh mode, as for vwa-classifieds
    scale: ${ZOO_DUMP_APP_SCALE:-1}
    healthcheck:
      <<: *zoo-healthcheck
      # Catalog search needs the bundled Elasticsearch, which starts a few seconds after the storefront
      test: [
        "CMD-SHELL",
        "curl -fs http://localhost:80/index.php > /dev/null && curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' > /dev/null",
      ]
    profiles:
      - on-demand
      - heavy

  microbin:
