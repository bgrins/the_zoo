  gitea-zoo:
    <<: *zoo-common
    depends_on:
      <<: [*deps-dns, *deps-postgres, *deps-mail, *deps-auth]
    mem_limit: 1g
    image: the_zoo-gitea-zoo
    pull_policy: never
    build: ./sites/apps/gitea.zoo
    # Repos and the rest of /data reset whenever postgres restores gitea_db, so a restart of
    # Gitea alone (e.g. at its memory limit) keeps them in step with the database
    entrypoint:
      - sh
      - /zoo/follow-restore.sh
      - postgres
      - gitea-zoo
      - /data
      - --
      - /app/entrypoint.sh
    environment:
      - TZ=UTC
      - ZOO_NO_SEED=${ZOO_NO_SEED:-false}
      - ZOO_GOLDEN_DIR=/golden-data
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres.zoo:5432
      - GITEA__database__NAME=gitea_db
      - GITEA__database__USER=gitea_user
      - GITEA__database__PASSWD=gitea_pw
      - GITEA__server__DOMAIN=gitea.zoo
      - GITEA__server__ROOT_URL=https://gitea.zoo/
      - GITEA__server__HTTP_PORT=3000
      - GITEA__mailer__ENABLED=true
      - GITEA__mailer__SMTP_ADDR=stalwart
      - GITEA__mailer__SMTP_PORT=25
      - GITEA__mailer__FROM=noreply@gitea.zoo
      - GITEA__mailer__FORCE_TRUST_SERVER_CERT=true
      - GITEA__service__DISABLE_REGISTRATION=false
      - GITEA__service__REQUIRE_SIGNIN_VIEW=false
      - GITEA__service__REGISTER_EMAIL_CONFIRM=false
      - GITEA__service__ENABLE_NOTIFY_MAIL=true
      - GITEA__service__DEFAULT_KEEP_EMAIL_PRIVATE=false
      - GITEA__service__DEFAULT_ALLOW_CREATE_ORGANIZATION=true
      - GITEA__service__DEFAULT_ENABLE_TIMETRACKING=true
      # In-process, so a restart after a database restore can't serve cached pre-restore data
      - GITEA__cache__ENABLED=true
      - GITEA__cache__ADAPTER=memory
      # The footer's page and template render times differ on every request
      - GITEA__other__SHOW_FOOTER_TEMPLATE_LOAD_TIME=false
      - USER_UID=1000
      - USER_GID=1000
      - SSL_CERT_FILE=/caddy-ca/pki/authorities/local/root.crt
    volumes:
      - caddy_data:/caddy-ca:ro
      - gitea_data:/data
      - ./core/follow-restore.sh:/zoo/follow-restore.sh:ro
      - zoo_state:/zoo-state:ro
      - zoo_snapshots:/zoo-snapshots:ro
    labels:
      - "zoo.domains=gitea.zoo:3000"
      - "zoo.description=Self-hosted Git service with web interface"
      - "zoo.icon=🐙"
      - "zoo.db=postgres"
      - "zoo.snapshot=/data"
    healthcheck:
      <<: *zoo-healthcheck
      test: [
        "CMD",
        "curl",
        "-f",
        "-s",
        "-o",
        "/dev/null",
        "http://localhost:3000",
      ]
    profiles:
      - on-demand

