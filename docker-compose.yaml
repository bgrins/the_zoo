networks:
  zoo-network:
    driver: bridge
    internal: true
    # internal only stops routing beyond the bridge; without an address on the host's end,
    # containers can't reach services listening on the host either
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: ${ZOO_SUBNET:-172.20.0.0/16}

  # used for proxy to accept connections & bind to port
  public:
    driver: bridge
    # Published ports work without outbound NAT, which would let the proxy reach the internet
    # (on Linux; Docker Desktop forwards the traffic anyway)
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: ${ZOO_PUBLIC_SUBNET:-172.21.0.0/30}

# Dependencies, combined per service from what it uses. Every zoo service resolves names
# through CoreDNS.
x-deps-dns: &deps-dns
  coredns:
    condition: service_healthy
x-deps-postgres: &deps-postgres
  postgres:
    condition: service_healthy
x-deps-mysql: &deps-mysql
  mysql:
    condition: service_healthy
x-deps-mail: &deps-mail
  stalwart:
    condition: service_healthy
# Signing in with auth.zoo, which Caddy routes to auth-zoo in front of Hydra
x-deps-auth: &deps-auth
  caddy:
    condition: service_healthy
  auth-zoo:
    condition: service_healthy
  hydra:
    condition: service_healthy

# Docker keeps every log line by default; the local driver rotates and compresses them
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

# Common configuration for all zoo services. unless-stopped rather than always, so a container
# stopped by hand or by Caddy's idle stop stays stopped when Docker restarts.
x-zoo-common: &zoo-common
  restart: unless-stopped
  # Every service sets a grace period: Docker Desktop gives a container without one 1s to stop
  # (moby/moby#52775)
  stop_grace_period: 10s
  # Limits sit at 3-4x the peak usage measured across the test suites and seeding, so one
  # runaway app can't starve the others. Heavier services set their own.
  mem_limit: 512m
  dns:
    - ${ZOO_DNS_IP:-172.20.250.2}
  networks:
    - zoo-network
  logging: *logging
  depends_on: *deps-dns

# Health check timing for core services. Probes run every start_interval until the first
# success, so dependents and `up --wait` proceed promptly, then every 30s. start_period must
# cover the slowest cold start: once it ends, an unhealthy service is only probed every 30s.
x-core-healthcheck: &core-healthcheck
  interval: 30s
  timeout: 3s
  retries: 3
  start_period: 60s
  start_interval: 200ms

# Common health check configuration for on-demand services
# start_period must cover the slowest cold start: probes run every start_interval
# until the first success, then fall back to the slow interval.
x-zoo-healthcheck: &zoo-healthcheck
  interval: 60s
  timeout: 5s
  retries: 3
  start_period: 180s
  start_interval: .3s

services:
  #
  # Core Services:
  #
  coredns:
    mem_limit: 256m
    logging: *logging
    # Built images have fixed names so every compose project on this host (worktrees, CLI
    # dev instances) reuses one build. Unseeded database builds get their own names. No
    # registry has them, so compose builds a missing one instead of trying to pull it.
    image: the_zoo-coredns
    pull_policy: never
    build: ./core/coredns
    restart: always
    stop_grace_period: 10s
    labels:
      - "zoo.core=true"
      - "zoo.description=CoreDNS"
    command: ["-conf", "/etc/coredns/Corefile"]
    environment:
      - TZ=UTC
      - ZOO_CADDY_IP=${ZOO_CADDY_IP:-172.20.250.3}
      - ZOO_PROXY_IP=${ZOO_PROXY_IP:-172.20.250.4}
    volumes:
      - ./core/coredns/Corefile:/etc/coredns/Corefile:ro
    networks:
      zoo-network:
        ipv4_address: ${ZOO_DNS_IP:-172.20.250.2}
    healthcheck:
      <<: *core-healthcheck
      test: [
        "CMD",
        "/busybox",
        "nslookup",
        "-type=a",
        "home.zoo",
        "127.0.0.1",
      ]

  caddy:
    mem_limit: 1g
    logging: *logging
    image: the_zoo-caddy
    pull_policy: never
    build: ./core/caddy
    restart: always
    stop_grace_period: 10s
    labels:
      - "zoo.core=true"
      - "zoo.description=Caddy Reverse Proxy"
    environment:
      - TZ=UTC
      # Chaos mode: Set to "1" to enable failure injection
      - CHAOS_MODE=${CHAOS_MODE:-0}
      # Fail injector probability (0.0-1.0) when CHAOS_MODE=1
      - CHAOS_MODE_FAIL_PROBABILITY=${CHAOS_MODE_FAIL_PROBABILITY:-0.2}
      # Random seed for reproducible failure patterns (optional)
      - CHAOS_MODE_FAIL_SEED=${CHAOS_MODE_FAIL_SEED:-}
      # Set to "1" to let the X-Chaos-Mode headers of any client override CHAOS_MODE=1
      - CHAOS_MODE_ALLOW_HEADER=${CHAOS_MODE_ALLOW_HEADER:-0}
      # IP addresses for network configuration
      - ZOO_PROXY_IP=${ZOO_PROXY_IP:-172.20.250.4}
      # HTTPS-only mode for static sites
      - ZOO_STATIC_HTTPS_ONLY=${ZOO_STATIC_HTTPS_ONLY:-true}
      # HTTPS-only mode for all sites (overrides individual settings)
      - ZOO_ALL_HTTPS_ONLY=${ZOO_ALL_HTTPS_ONLY:-false}
      # Stop on-demand apps after this long without requests, e.g. 4h (off when empty)
      - ZOO_IDLE_STOP=${ZOO_IDLE_STOP:-}
    volumes:
      - ./core/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./core/SITES.yaml:/etc/caddy/SITES.yaml:ro
      - ./sites/static:/static:ro
      # Full Docker API access (dev-only); :ro on a socket doesn't restrict API calls
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/root/.local/share/caddy
    dns:
      - ${ZOO_DNS_IP:-172.20.250.2}
    networks:
      zoo-network:
        ipv4_address: ${ZOO_CADDY_IP:-172.20.250.3}
    depends_on:
      - coredns
    healthcheck:
      <<: *core-healthcheck
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:80/health"]

  proxy:
    mem_limit: 512m
    logging: *logging
    image: the_zoo-proxy
    pull_policy: never
    build: ./core/proxy
    restart: always
    labels:
      - "zoo.core=true"
      - "zoo.description=Squid Forward Proxy"
    # Loopback only by default: the proxy has no auth and reaches every zoo app, including
    # auto-logged-in admin tools. Set ZOO_PROXY_BIND=0.0.0.0 to share it on the network.
    ports:
      - "${ZOO_PROXY_BIND:-127.0.0.1}:${ZOO_PROXY_PORT:-3128}:3128"
    environment:
      - TZ=UTC
      # Optional: Set PROXY_USER and PROXY_PASS for basic authentication
      - PROXY_USER=${PROXY_USER:-}
      - PROXY_PASS=${PROXY_PASS:-}
    volumes:
      - ./core/proxy/acls.conf:/etc/squid/acls.conf:ro
    dns:
      - ${ZOO_DNS_IP:-172.20.250.2}
    networks:
      zoo-network:
        ipv4_address: ${ZOO_PROXY_IP:-172.20.250.4}
      public:
    # Squid sizes its file descriptor tables from this limit; Docker Desktop's default of
    # 1048576 costs ~135MB of RSS.
    ulimits:
      nofile: 65536
    # Squid logs to stdout and caches in memory, so the image's volumes only need scratch mounts
    tmpfs:
      - /var/log/squid:mode=1777
      - /var/spool/squid:mode=1777
    # Squid waits up to shutdown_lifetime (30s) for open connections before exiting
    stop_grace_period: 1s
    depends_on:
      caddy:
        condition: service_healthy
      coredns:
        condition: service_healthy
    healthcheck:
      <<: *core-healthcheck
      test: [
        "CMD",
        "sh",
        "-c",
        "if [ -n \"$$PROXY_USER\" ] && [ -n \"$$PROXY_PASS\" ]; then curl -f --proxy http://$$PROXY_USER:$$PROXY_PASS@localhost:3128 http://home.zoo; else curl -f --proxy http://localhost:3128 http://home.zoo; fi",
      ]

  redis:
    mem_limit: 512m
    logging: *logging
    image: redis:7.4.11-alpine
    restart: always
    stop_grace_period: 10s
    labels:
      - "zoo.core=true"
      - "zoo.description=Redis"
    command: redis-server --save "" --appendonly no
    environment:
      - TZ=UTC
    # Nothing is saved, so the image's /data volume only needs a scratch mount
    tmpfs:
      - /data
    networks:
      - zoo-network
    healthcheck:
      <<: *core-healthcheck
      test: ["CMD", "redis-cli", "ping"]

  stalwart:
    mem_limit: 512m
    logging: *logging
    image: the_zoo-stalwart
    pull_policy: never
    build: ./core/stalwart
    restart: always
    # Stalwart caches accounts and settings, so it restarts whenever postgres is restored
    entrypoint:
      - sh
      - /zoo/follow-restore.sh
      - postgres
      - stalwart
      - --
      - /usr/local/bin/startup.sh
    environment:
      - TZ=UTC
      - PORT=8080
      - ADMIN_PASSWORD=zoo-mail-admin-pw
    dns:
      - ${ZOO_DNS_IP:-172.20.250.2}
    networks:
      - zoo-network
    # The startup script doesn't forward SIGTERM to Stalwart; mail is stored in postgres
    stop_grace_period: 1s
    volumes:
      # Config (rewritten on every start) and logs
      - stalwart_data:/opt/stalwart-mail
      - ./core/follow-restore.sh:/zoo/follow-restore.sh:ro
      - zoo_state:/zoo-state:ro
    depends_on:
      <<: [*deps-dns, *deps-postgres]
    labels:
      - "zoo.core=true"
      - "zoo.description=Stalwart Mail Server"
      - "zoo.domains=mail-api.zoo:8080"
      - "zoo.db=postgres"
    healthcheck:
      <<: *core-healthcheck
      test: ["CMD", "sh", "-c", "echo QUIT | nc localhost 25 || exit 1"]

  postgres:
    mem_limit: 2g
    logging: *logging
    # Compose can't test ZOO_NO_SEED's value, so unseeded builds set this suffix too (.env.fresh)
    image: the_zoo-postgres${ZOO_DB_IMAGE_SUFFIX:-}
    pull_policy: never
    build:
      context: ./core/postgres
      args:
        - ZOO_NO_SEED=${ZOO_NO_SEED:-false}
    restart: always
    labels:
      - "zoo.core=true"
      - "zoo.description=PostgreSQL"
      - "zoo.snapshot=/var/lib/postgresql/data"
    environment:
      - TZ=UTC
      - ZOO_BASELINE=${ZOO_BASELINE:-}
    # A named volume survives recreates, where the image's anonymous one would be left behind
    # (~2GB each time); the entrypoint restores the golden data (or snapshot ZOO_BASELINE)
    # into it on every start, except after an unclean shutdown
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - zoo_state:/zoo-state
      - zoo_snapshots:/zoo-snapshots:ro
    # A shutdown that runs past the grace period ends in SIGKILL, which the next start would
    # take for a crash and keep the data
    stop_grace_period: 60s
    networks:
      - zoo-network
    healthcheck:
      <<: *core-healthcheck
      test: ["CMD-SHELL", "pg_isready -U postgres -d zoodb"]

  mysql:
    mem_limit: 2g
    logging: *logging
    image: the_zoo-mysql${ZOO_DB_IMAGE_SUFFIX:-}
    pull_policy: never
    build:
      context: ./core/mysql
      args:
        - ZOO_NO_SEED=${ZOO_NO_SEED:-false}
    restart: always
    labels:
      - "zoo.core=true"
      - "zoo.description=MySQL"
      - "zoo.snapshot=/var/lib/mysql"
    environment:
      - TZ=UTC
      - ZOO_BASELINE=${ZOO_BASELINE:-}
    # performance_schema roughly doubles mysqld's idle memory and nothing in the zoo reads it
    command: ["mysqld", "--performance_schema=OFF"]
    # Named, restored and given time to shut down as for postgres
    volumes:
      - mysql_data:/var/lib/mysql
      - zoo_state:/zoo-state
      - zoo_snapshots:/zoo-snapshots:ro
    stop_grace_period: 60s
    networks:
      - zoo-network
    healthcheck:
      <<: *core-healthcheck
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]

  hydra:
    mem_limit: 512m
    logging: *logging
    image: the_zoo-hydra
    pull_policy: never
    build: ./core/hydra
    restart: always
    stop_grace_period: 10s
    # Migrates only at startup, so it restarts whenever postgres is restored (an unseeded
    # restore drops its tables)
    entrypoint:
      - sh
      - /zoo/follow-restore.sh
      - postgres
      - hydra
      - --
      - /startup.sh
    volumes:
      - ./core/follow-restore.sh:/zoo/follow-restore.sh:ro
      - zoo_state:/zoo-state:ro
    environment:
      - TZ=UTC
      - DSN=postgres://auth_user:auth_pw@postgres.zoo/auth_db?sslmode=disable
      - URLS_SELF_ISSUER=https://auth.zoo
      - URLS_SELF_PUBLIC=https://auth.zoo
      - SERVE_COOKIES_SAME_SITE_MODE=Lax
      - URLS_CONSENT=https://auth.zoo/consent
      - URLS_LOGIN=https://auth.zoo/login
      - URLS_LOGOUT=https://auth.zoo/logout
      - URLS_POST_LOGOUT_REDIRECT=https://auth.zoo/
      - SECRETS_SYSTEM=youReallyNeedToChangeThis
      - OIDC_SUBJECT_IDENTIFIERS_SUPPORTED_TYPES=public
      - SERVE_PUBLIC_CORS_ENABLED=true
      - SERVE_PUBLIC_CORS_ALLOWED_ORIGINS=https://*.zoo,http://*.zoo
      - PORT=4444
    dns:
      - ${ZOO_DNS_IP:-172.20.250.2}
    networks:
      - zoo-network
    depends_on:
      <<: [*deps-dns, *deps-postgres]
    healthcheck:
      <<: *core-healthcheck
      test: ["CMD", "/healthcheck.sh"]
      timeout: 5s
    labels:
      - "zoo.core=true"
      - "zoo.description=Ory Hydra"
      - "zoo.db=postgres"

  auth-zoo:
    <<: *zoo-common
    depends_on:
      <<: [*deps-dns, *deps-postgres, *deps-mail]
      hydra:
        condition: service_healthy
    # Starts with the core services rather than on demand
    restart: always
    image: the_zoo-auth-zoo
    pull_policy: never
    build: ./sites/apps/auth.zoo
    # Sessions (with the signed-in user) live in memory, and migrations run at startup, so it
    # restarts whenever postgres is restored
    entrypoint:
      - sh
      - /zoo/follow-restore.sh
      - postgres
      - auth-zoo
      - --
      - docker-entrypoint.sh
      - npm
      - start
    environment:
      - TZ=UTC
      - PORT=3000
      - NODE_ENV=development
      - SMTP_HOST=stalwart
      - SMTP_PORT=25
      - SMTP_FROM=noreply@auth.zoo
      - SSL_CERT_FILE=/caddy-ca/pki/authorities/local/root.crt
    volumes:
      - ./sites/apps/auth.zoo:/app
      - ./core/SITES.yaml:/app/SITES.yaml:ro
      - caddy_data:/caddy-ca:ro
      - ./core/follow-restore.sh:/zoo/follow-restore.sh:ro
      - zoo_state:/zoo-state:ro
    # Hides dependencies installed on the host (for typecheck:auth), so Node finds the image's
    tmpfs:
      - /app/node_modules
    labels:
      - "zoo.domains=auth.zoo"
      - "zoo.description=Zoo Identity: one account and single sign-on for the zoo's apps"
      - "zoo.icon=🔐"
      - "zoo.db=postgres"
    healthcheck:
      <<: *core-healthcheck
      test: [
        "CMD",
        "wget",
        "-q",
        "-O",
        "/dev/null",
        "http://localhost:3000/api/health",
      ]

  secure-gravatar-com:
    <<: *zoo-common
    image: the_zoo-secure-gravatar-com
    pull_policy: never
    build: ./sites/apps/secure.gravatar.com
    environment:
      - TZ=UTC
      - SSL_CERT_FILE=/caddy-ca/pki/authorities/local/root.crt
    volumes:
      - caddy_data:/caddy-ca:ro
    labels:
      - "zoo.domains=secure.gravatar.com:8080"
      - "zoo.description=Gravatar avatar image service"
      - "zoo.icon=👤"
    healthcheck:
      <<: *zoo-healthcheck
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/avatar/test"]
    profiles:
      - on-demand

  #
  # Applications:
  #

  # Domain mappings from zoo-sites/docker/zoo-snippet.yaml at the pinned image commit.
  zoo-sites:
    <<: *zoo-common
    image: ghcr.io/bgrins/zoo-sites:sha-bbd91fc@sha256:c514c4cd41302823ad9a95018a0209577d32007378e88320ffef66210b393465
    environment:
      - TZ=UTC
      - EVAL_SEED=zoo
    expose:
      - "8100"
    labels:
      - "zoo.domains=abaca.zoo:8100,alderpost.zoo:8101,ashline-quotient.zoo:8102,aurelia-playhouse.zoo:8103,boxelder.zoo:8105,brantmoor.zoo:8106,brindle-fig.zoo:8107,cadre-workplace.zoo:8108,canvas-swatch.zoo:8109,cindergrid.zoo:8110,civic-revenue.zoo:8111,coppermast.zoo:8112,corvane.zoo:8113,cresthaven.zoo:8114,draymere.zoo:8115,farholt.zoo:8116,ferncliff.zoo:8117,fernlight.zoo:8118,fernmail.zoo:8119,fernwood-commons.zoo:8120,gadgetron.zoo:8121,gadgetron-mirror.zoo:8122,grelsby-water.zoo:8123,halbeck.zoo:8124,harrowgate-works.zoo:8125,hearthline.zoo:8126,kelverne.zoo:8127,kestrel-peak.zoo:8128,kettleforge.zoo:8129,lakefront-vendor.zoo:8130,larkfield.zoo:8131,lumeva.zoo:8132,drennhill-dental.zoo:8133,marlowe-depot.zoo:8134,marlstone.zoo:8135,marrowfield.zoo:8136,metronome.zoo:8137,millrace.zoo:8138,nerrow-strait.zoo:8139,marrowgate.zoo:8140,nimbrel.zoo:8141,northgate-domains.zoo:8142,northmarsh.zoo:8143,northwind-ir.zoo:8144,ollister-crane.zoo:8145,orsino.zoo:8146,ostara.zoo:8147,overlane.zoo:8148,peregrine-court.zoo:8149,qandara-taa.zoo:8150,quennell.zoo:8151,kelsmere.zoo:8152,skerrow-radio.zoo:8153,solstice.zoo:8154,stavelock.zoo:8155,tamarack-hollow.zoo:8156,tealwave.zoo:8157,thornbury-trust.zoo:8158,trelowen.zoo:8159,caldmoor-bank-login.zoo:8160,caldmoorbank-online.zoo:8161,verlan-transit.zoo:8162,voltro.zoo:8163,waypost.zoo:8164,zellick.zoo:8165"
      - "zoo.description=Simulated websites from zoo-sites"
    healthcheck:
      <<: *zoo-healthcheck
    profiles:
      - on-demand

  # From https://github.com/bgrins/vwa_classifieds_optimized/:
  # blake.sullivan@gmail.com / Password.123
  vwa-classifieds:
    <<: *zoo-common
    depends_on:
      <<: [*deps-dns, *deps-mysql]
    image: ghcr.io/bgrins/vwa_classifieds_web:1@sha256:a75c98c1383e125def1149e538175c0ca30a26a205fb9c1e2e3b5394a2d3984a
    # PHP sessions (in /tmp, with the signed-in user's ID) reset whenever mysql restores the
    # database. Uploaded photos stay in the container layer until it's recreated.
    entrypoint:
      - sh
      - /zoo/follow-restore.sh
      - mysql
      - vwa-classifieds
      - /tmp
      - --
      - docker-php-entrypoint
      - php
      - -S
      - 0.0.0.0:9980
    environment:
      - TZ=UTC
      - PORT=9980
      - CLASSIFIEDS=//classifieds.zoo/
      - RESET_TOKEN=4b61655535e7ed388f0d40a93600254c
      - DB_HOST=mysql
      - DB_USER=vwa-classifieds_user
      - DB_PASSWORD=vwa-classifieds_pw
      - DB_NAME=vwa-classifieds_db
      - DB_TABLE_PREFIX=oc_
      - SSL_CERT_FILE=/caddy-ca/pki/authorities/local/root.crt
    volumes:
      - caddy_data:/caddy-ca:ro
      - ./core/follow-restore.sh:/zoo/follow-restore.sh:ro
      - zoo_state:/zoo-state:ro
    labels:
      - "zoo.domains=classifieds.zoo"
      - "zoo.description=Classified ads marketplace from VisualWebArena"
      - "zoo.icon=🛒"
      - "zoo.db=mysql"
    # 0 in fresh mode (.env.fresh): the app runs off its database dump, which ZOO_NO_SEED skips
    scale: ${ZOO_DUMP_APP_SCALE:-1}
    healthcheck:
      <<: *zoo-healthcheck
      # -L follows redirects (app redirects localhost to classifieds.zoo)
      # --resolve forces classifieds.zoo to resolve to localhost
      test: [
        "CMD",
        "curl",
        "-f",
        "-s",
        "-L",
        "--resolve",
        "classifieds.zoo:9980:127.0.0.1",
        "http://localhost:9980/",
      ]
    profiles:
      - on-demand

  wiki-zoo:
    <<: *zoo-common
    image: the_zoo-wiki-zoo
    pull_policy: never
    build:
      context: ./sites/apps/wiki.zoo
    labels:
      - "zoo.domains=wiki.zoo"
      - "zoo.description=Offline Wikipedia reader and knowledge base"
      - "zoo.icon=📚"
    healthcheck:
      <<: *zoo-healthcheck
      test: ["CMD", "nc", "-z", "0.0.0.0", "8080"]
    command:
      - "--customIndex /zim/index.html --blockexternal *.zim"
    environment:
      - TZ=UTC
      - PORT=8080
      - SSL_CERT_FILE=/caddy-ca/pki/authorities/local/root.crt
    volumes:
      - caddy_data:/caddy-ca:ro
    # The ZIM file lives in /zim; the base image's /data volume only needs a scratch mount
    tmpfs:
      - /data
    profiles:
      - on-demand

  misc-zoo:
    <<: *zoo-common
    depends_on:
      <<: [*deps-dns, *deps-auth]
    image: the_zoo-misc-zoo
    pull_policy: never
    build: ./sites/apps/misc.zoo
    environment:
      - TZ=UTC
      - SSL_CERT_FILE=/caddy-ca/pki/authorities/local/root.crt
    volumes:
      - caddy_data:/caddy-ca:ro
    labels:
      - "zoo.domains=misc.zoo:3000"
      - "zoo.description=Miscellaneous utilities and test endpoints"
      - "zoo.icon=🔧"
    healthcheck:
      <<: *zoo-healthcheck
      test: [
        "CMD",
        "wget",
        "-q",
        "-O-",
        "http://localhost:3000/health",
      ]
    profiles:
      - on-demand

  miniflux:
    <<: *zoo-common
    depends_on:
      <<: [*deps-dns, *deps-postgres, *deps-auth]
    image: miniflux/miniflux:2.2.9
    # Migrates and creates the admin only at startup, so it restarts whenever postgres is
    # restored (an unseeded restore drops its tables)
    entrypoint:
      - sh
      - /zoo/follow-restore.sh
      - postgres
      - miniflux
      - --
      - /usr/bin/miniflux
    environment:
      - TZ=UTC
      - DATABASE_URL=postgres://miniflux_user:miniflux_pw@postgres.zoo/miniflux_db?sslmode=disable
      - RUN_MIGRATIONS=1
      - CREATE_ADMIN=1
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=zoopassword
      - PORT=8080
      # OAuth2/OIDC Configuration
      - OAUTH2_PROVIDER=oidc
      - OAUTH2_CLIENT_ID=miniflux
      - OAUTH2_CLIENT_SECRET=miniflux-oauth-secret
      - OAUTH2_REDIRECT_URL=https://miniflux.zoo/oauth2/oidc/callback
      # Must match Hydra's issuer exactly
      - OAUTH2_OIDC_DISCOVERY_ENDPOINT=https://auth.zoo
      - OAUTH2_OIDC_PROVIDER_NAME=Zoo Auth
      - OAUTH2_USER_CREATION=1
      - SSL_CERT_FILE=/caddy-ca/pki/authorities/local/root.crt
      # No polling or cleanup, so the entries stay as the golden state has them
      - DISABLE_SCHEDULER_SERVICE=1
    volumes:
      - caddy_data:/caddy-ca:ro
      - ./core/follow-restore.sh:/zoo/follow-restore.sh:ro
      - zoo_state:/zoo-state:ro
    labels:
      - "zoo.domains=miniflux.zoo"
      - "zoo.description=Minimalist feed reader with RSS/Atom support"
      - "zoo.icon=📰"
      - "zoo.db=postgres"
    healthcheck:
      <<: *zoo-healthcheck
      test: [
        "CMD",
        "wget",
        "-q",
        "-O-",
        "http://localhost:8080",
      ]
    profiles:
      - on-demand

