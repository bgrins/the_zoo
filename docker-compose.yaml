  postmill:
    <<: *zoo-common
    depends_on:
      <<: [*deps-dns, *deps-postgres]
    image: ghcr.io/bgrins/vwa-reddit-optimized-standalone-slim:1@sha256:fc4564e730ae5fcf0199ea8a94572ed459ea6d8efed24a30a1ff4e7678f34916
    environment:
      - TZ=UTC
      # {"username": "MarvelsGrantMan136", "password": "test1234"},
      - DATABASE_URL=postgresql://postmill_user:postmill_pw@postgres.zoo/postmill_db
      - APP_SECRET=zoo-postmill-secret-key
      - UPLOAD_HOST=postmill.zoo
      - UPLOAD_ROOT=https://postmill.zoo/
      - TRUSTED_PROXIES=REMOTE_ADDR
      - SSL_CERT_FILE=/caddy-ca/pki/authorities/local/root.crt
    volumes:
      - caddy_data:/caddy-ca:ro
      - ./core/follow-restore.sh:/zoo/follow-restore.sh:ro
      - zoo_state:/zoo-state:ro
    # Replaces the image's /docker-entrypoint-standalone.sh, which rebuilds the Symfony cache
    # before this config is written. php-fpm clears the environment, so config goes in .env.local.
    # Postmill restarts, clearing the cache, and its sessions reset whenever postgres is restored.
    entrypoint:
      - sh
      - /zoo/follow-restore.sh
      - postgres
      - postmill
      - /var/www/html/var/sessions
      - --
      - sh
      - -ec
      - |
          cat > /var/www/html/.env.local <<EOF
          APP_ENV=prod
          APP_SECRET=$${APP_SECRET}
          DATABASE_URL=$${DATABASE_URL}
          UPLOAD_HOST=$${UPLOAD_HOST}
          UPLOAD_ROOT=$${UPLOAD_ROOT}
          TRUSTED_PROXIES=$${TRUSTED_PROXIES}
          EOF
          php /var/www/html/bin/console cache:clear --env=prod --no-debug
          chown -R nginx:nginx /var/www/html/var
          exec /usr/bin/supervisord -n -c /etc/supervisord.conf
    labels:
      - "zoo.domains=postmill.zoo:80"
      - "zoo.description=Reddit-like forum and link aggregator from VisualWebArena"
      - "zoo.icon=💬"
      - "zoo.db=postgres"
    # 0 in fresh mode, as for vwa-classifieds
    scale: ${ZOO_DUMP_APP_SCALE:-1}
    healthcheck:
      <<: *zoo-healthcheck
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:80/"]
    profiles:
      - on-demand
      - heavy

  analytics-zoo:
    <<: *zoo-common
    depends_on:
      <<: [*deps-dns, *deps-mysql]
    mem_limit: 1g
    image: the_zoo-analytics-zoo
    pull_policy: never
    # The image's SIGWINCH would reach core/follow-restore.sh, which passes on only TERM and INT
    stop_signal: SIGTERM
    build: ./sites/apps/analytics.zoo
    # On every start /var/www/html is emptied and gets the golden config (or the snapshot's);
    # the image's entrypoint then copies in the code of the image's Matomo version
    entrypoint:
      - sh
      - /zoo/follow-restore.sh
      - --every-start
      - mysql
      - analytics-zoo
      - /var/www/html/config
      - /var/www/html
      - --
      - /entrypoint.sh
      - apache2-foreground
    environment:
      - TZ=UTC
      - ZOO_NO_SEED=${ZOO_NO_SEED:-false}
      - ZOO_GOLDEN_DIR=/golden-data/config
      - MATOMO_DATABASE_HOST=mysql
      - MATOMO_DATABASE_ADAPTER=mysql
      - MATOMO_DATABASE_USERNAME=analytics_user
      - MATOMO_DATABASE_PASSWORD=analytics_pw
      - MATOMO_DATABASE_DBNAME=analytics_db
      - MATOMO_DATABASE_TABLES_PREFIX=matomo_
      - PHP_MEMORY_LIMIT=256M
      - SSL_CERT_FILE=/caddy-ca/pki/authorities/local/root.crt
    volumes:
      - caddy_data:/caddy-ca:ro
      - analytics_data:/var/www/html
      - ./core/follow-restore.sh:/zoo/follow-restore.sh:ro
      - zoo_state:/zoo-state:ro
      - zoo_snapshots:/zoo-snapshots:ro
    labels:
      - "zoo.domains=analytics.zoo:80"
      - "zoo.description=Open-source web analytics platform"
      - "zoo.icon=📊"
      - "zoo.db=mysql"
      - "zoo.snapshot=/var/www/html/config"
    healthcheck:
      <<: *zoo-healthcheck
      test: [
        "CMD",
        "curl",
        "-f",
        "-s",
        "-o",
        "/dev/null",
        "http://localhost:80",
      ]
    profiles:
      - on-demand

  mattermost:
    <<: *zoo-common
    depends_on:
      <<: [*deps-dns, *deps-postgres, *deps-mail]
    mem_limit: 1g
    image: mattermost/mattermost-team-edition:10.5.14
    platform: linux/amd64
    # Uploaded files and the plugins extracted from them reset whenever postgres restores
    # mattermost_db
    entrypoint:
      - sh
      - /zoo/follow-restore.sh
      - postgres
      - mattermost
      - /mattermost/data
      - /mattermost/plugins
      - /mattermost/client/plugins
      - --
      - /entrypoint.sh
      - mattermost
    environment:
      - TZ=UTC
      # Store config in database so plugin state survives pg_dump/restore
      - MM_CONFIG=postgres://mattermost_user:mattermost_pw@postgres.zoo/mattermost_db?sslmode=disable
      # Server settings
      - MM_SERVICESETTINGS_SITEURL=https://mattermost.zoo
      - MM_SERVICESETTINGS_LISTENADDRESS=:8065
      - MM_SERVICESETTINGS_ENABLELOCALMODE=true
      # Database
      - MM_SQLSETTINGS_DRIVERNAME=postgres
      - MM_SQLSETTINGS_DATASOURCE=postgres://mattermost_user:mattermost_pw@postgres.zoo/mattermost_db?sslmode=disable
      # Team settings - allow open signup for dev
      - MM_TEAMSETTINGS_ENABLEOPENSERVER=true
      - MM_TEAMSETTINGS_ENABLEUSERDEACTIVATION=true
      # Email settings - configured for Stalwart SMTP
      - MM_EMAILSETTINGS_ENABLESIGNUPWITHEMAIL=true
      - MM_EMAILSETTINGS_ENABLESIGNINWITHEMAIL=true
      - MM_EMAILSETTINGS_ENABLESIGNINWITHUSERNAME=true
      - MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS=true
      - MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION=false
      - MM_EMAILSETTINGS_SMTPSERVER=stalwart
      - MM_EMAILSETTINGS_SMTPPORT=25
      - MM_EMAILSETTINGS_ENABLESMTPAUTH=false
      - MM_EMAILSETTINGS_FEEDBACKNAME=Zoo Mattermost
      - MM_EMAILSETTINGS_FEEDBACKEMAIL=noreply@mattermost.zoo
      - MM_EMAILSETTINGS_REPLYTOADDRESS=noreply@mattermost.zoo
      - MM_EMAILSETTINGS_ENABLEPREVIEWMODEBANNER=false
      # Fixed encryption key for reproducible golden state
      - MM_SQLSETTINGS_ATRESTENCRYPTKEY=zoo-mattermost-encryption-key-32
      # File storage
      - MM_FILESETTINGS_DRIVERNAME=local
      - MM_FILESETTINGS_DIRECTORY=/mattermost/data
      # Logging
      - MM_LOGSETTINGS_CONSOLELEVEL=INFO
      - MM_LOGSETTINGS_ENABLEFILE=false
      # Plugin settings
      - MM_PLUGINSETTINGS_ENABLEUPLOADS=true
      # Developer mode shows a banner on every JavaScript error; testing mode adds /test commands
      - MM_SERVICESETTINGS_ENABLETESTING=false
      - MM_SERVICESETTINGS_ENABLEDEVELOPER=false
      # These need the internet: the GIF picker searches Giphy, the marketplace lists remote plugins
      - MM_SERVICESETTINGS_ENABLEGIFPICKER=false
      # The zoo is offline; the check also rewrites LastSecurityTime on every start
      - MM_SERVICESETTINGS_ENABLESECURITYFIXALERT=false
      - MM_PLUGINSETTINGS_ENABLEREMOTEMARKETPLACE=false
      # Skip desktop app prompt and onboarding wizard
      - MM_SERVICESETTINGS_ENABLEDESKTOPLANDINGPAGE=false
      - MM_SERVICESETTINGS_ENABLEONBOARDINGFLOW=false
      - SSL_CERT_FILE=/caddy-ca/pki/authorities/local/root.crt
    # config.json goes unused (MM_CONFIG keeps the config in the database)
    volumes:
      - caddy_data:/caddy-ca:ro
      - mattermost_data:/mattermost/data
      - mattermost_plugins:/mattermost/plugins
      - mattermost_client_plugins:/mattermost/client/plugins
      - mattermost_config:/mattermost/config
      - ./core/follow-restore.sh:/zoo/follow-restore.sh:ro
      - zoo_state:/zoo-state:ro
      - zoo_snapshots:/zoo-snapshots:ro
    tmpfs:
      - /mattermost/logs:mode=1777
    labels:
      - "zoo.domains=mattermost.zoo:8065"
      - "zoo.description=Team messaging and collaboration platform"
      - "zoo.icon=💬"
      - "zoo.db=postgres"
      - "zoo.snapshot=/mattermost/data"
    healthcheck:
      <<: *zoo-healthcheck
      test: [
        "CMD",
        "curl",
        "-f",
        "-s",
        "http://localhost:8065/api/v4/system/ping",
      ]
    profiles:
      - on-demand

volumes:
  analytics_data:
  caddy_data:
  focalboard_data:
  gitea_data:
  mattermost_client_plugins:
  mattermost_config:
  mattermost_data:
  mattermost_plugins:
  mysql_data:
  postgres_data:
  snappymail_data:
  stalwart_data:
  # Written by the postgres and mysql entrypoints, read by the services that follow them
  zoo_state:
  # the_zoo snapshot save/restore. External, so `down -v` keeps it: the CLI and the npm start
  # scripts create it. `the_zoo clean` removes a CLI instance's (named in its .env); the dev
  # environment's outlasts `npm run stop` until `docker volume rm the_zoo_zoo_snapshots`.
  zoo_snapshots:
    external: true
    name: ${ZOO_SNAPSHOTS_VOLUME:-${COMPOSE_PROJECT_NAME}_zoo_snapshots}
